<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kadaken">
  <!-- No letter. This is the wordmark's own idea with the type taken away: a
       plate cut by one diagonal, cooled above it and still hot below. Shapes
       rather than text, so it holds at 16px where the word never could. -->
  <defs>
    <linearGradient id="hot" x1="0" y1="0.25" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#c94a02"/>
    </linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#8e99a8"/>
      <stop offset="1" stop-color="#5f6a79"/>
    </linearGradient>
    <clipPath id="plate">
      <path d="M12 2 H62 V50 L50 62 H2 V14 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#plate)">
    <rect x="0" y="0" width="64" height="64" fill="url(#cold)"/>
    <path d="M-4 44 L68 22 L68 68 L-4 68 Z" fill="url(#hot)"/>
    <path d="M-4 40.5 L68 18.5 L68 23 L-4 45 Z" fill="#ffe6c2"/>
  </g>
</svg>
